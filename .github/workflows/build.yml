name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # release — с R8: быстрый и маленький, ставить на телефон его.
      # debug — медленный (Compose без оптимизаций), только для отладки.
      - name: Build release + debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/release/app-release.apk BearPhone-${{ github.run_number }}.apk
          mv app/build/outputs/apk/debug/app-debug.apk BearPhone-${{ github.run_number }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BearPhone-${{ github.run_number }}
          path: BearPhone-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BearPhone-${{ github.run_number }}-debug
          path: BearPhone-${{ github.run_number }}-debug.apk
